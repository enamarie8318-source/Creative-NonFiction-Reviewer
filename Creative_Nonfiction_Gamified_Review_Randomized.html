<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creative Nonfiction — Gamified Review</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#182230}
.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 5px 22px #0001}
h1{font-size:27px;margin:0 0 6px}h2{font-size:20px;line-height:1.45}.muted{color:#667085;font-size:14px}
.top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;font-weight:700;font-size:13px}
.bar{height:10px;background:#e7ebf2;border-radius:20px;overflow:hidden;margin-top:14px}.fill{height:100%;width:0;background:#4f46e5;transition:.3s}
.option{display:block;width:100%;text-align:left;border:2px solid #e2e7ef;background:white;border-radius:13px;padding:14px;margin:8px 0;font-size:16px;cursor:pointer}
.option:hover{border-color:#4f46e5;background:#fafaff}.option.correct{border-color:#16a34a;background:#f0fdf4}.option.wrong{border-color:#dc2626;background:#fef2f2}
.next,.startbtn{width:100%;border:0;border-radius:12px;padding:14px;background:#4f46e5;color:white;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
button:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:14px;padding:14px;border-radius:12px;background:#f6f8fb;line-height:1.5}
.center{text-align:center}.hidden{display:none}.score{font-weight:700}@media(max-width:500px){.wrap{padding:9px}.card{padding:17px}h1{font-size:24px}}
</style></head>
<body><div class="wrap">
<div id="intro" class="card center">
<h1>🎮 Creative Nonfiction Challenge</h1>
<p><b>ALS • 60-Item Gamified Review</b></p>
<p class="muted">Coverage: LAS 1–14 • Questions randomized every game</p>
<p>⭐ Easy = 1 point &nbsp; ⭐⭐ Moderate = 2 points &nbsp; ⭐⭐⭐ Hard = 3 points</p>
<button class="startbtn" id="start">🚀 START REVIEW</button>
</div>
<div id="game" class="hidden">
<div class="card"><div class="top">
<div><b>Creative Nonfiction</b><div class="muted" id="count"></div></div>
<div class="score">⭐ <span id="score">0</span> pts<br><span class="muted">🔥 Streak: <span id="streak">0</span></span></div>
</div><div class="bar"><div class="fill" id="fill"></div></div></div>
<div class="card"><span class="badge" id="diff"></span><h2 id="question"></h2>
<div id="options"></div><div class="feedback" id="feedback"></div>
<button class="next" id="next" disabled>Next Question →</button></div></div>
<div id="finish" class="card center hidden"><h1>🏆 Review Complete!</h1>
<h2 id="final"></h2><p id="msg"></p>
<button class="startbtn" id="again">🔄 PLAY AGAIN — NEW RANDOM ORDER</button></div>
</div>
<script>
const DATA=[{"q": "What is Creative Nonfiction according to the learning material?", "o": ["A literary form that combines factual events with literary techniques", "A completely fictional story with invented events", "A list of facts without any storytelling", "A poem that does not use real events"], "a": 0, "d": "Easy", "e": "Creative nonfiction melds nonfiction with literary techniques to present real events."}, {"q": "Which point of view is said to be commonly used in creative nonfiction?", "o": ["First person", "Second person only", "Third person only", "No point of view"], "a": 0, "d": "Easy", "e": "The material notes that creative nonfiction often uses the first-person point of view."}, {"q": "Which combination best represents what a creative nonfiction writer should do?", "o": ["Research facts, catch readers’ attention, and present a true story artistically", "Invent events, avoid evidence, and focus only on entertainment", "Use only statistics and remove all literary elements", "Write only about imaginary personal experiences"], "a": 0, "d": "Moderate", "e": "Creative nonfiction should be well researched, engaging, and artistic while remaining true."}, {"q": "Why can creative nonfiction be described as 'literary journalism'?", "o": ["It combines factual reporting with literary storytelling techniques.", "It is always written as a newspaper article.", "It contains only journalistic statistics.", "It is fictional journalism."], "a": 0, "d": "Moderate", "e": "It presents real events using literary techniques."}, {"q": "A writer wants to make a true account more engaging but refuses to verify any of the events. Which principle of creative nonfiction is being violated?", "o": ["The requirement that factual claims be ethical and verifiable", "The use of first-person point of view", "The use of dialogue", "The use of descriptive language"], "a": 0, "d": "Hard", "e": "True events must be supported by evidence and presented ethically."}, {"q": "What is a key responsibility of a creative nonfiction writer when dealing with factual details?", "o": ["Be careful and accurate with factual details", "Change facts to make the story exciting", "Avoid taking notes", "Use imagined events as evidence"], "a": 0, "d": "Easy", "e": "The writer is expected to be careful and accurate with factual details."}, {"q": "Why should a nonfiction writer record information immediately after gathering or observing it?", "o": ["To preserve accurate details and support the whole story", "To make the story fictional", "To avoid remembering anything later", "To replace research with imagination"], "a": 0, "d": "Moderate", "e": "Recording information promptly helps preserve accurate details."}, {"q": "Which statement best describes the usual content of creative nonfiction?", "o": ["A real-world story based on observations, experiences, or events involving the writer or others", "Only the writer's autobiography", "Only invented characters and events", "Only statistical tables"], "a": 0, "d": "Moderate", "e": "Creative nonfiction may involve the writer or others as long as it is based on something real."}, {"q": "Which approach best helps a creative nonfiction writer reveal the meaning of a real-life story?", "o": ["Present the storyline through a personal account arranged chronologically or creatively", "List facts without showing a storyline", "Replace real experiences with imagined ones", "Remove all descriptive details"], "a": 0, "d": "Hard", "e": "The material says the storyline can be arranged chronologically or creatively to enhance suspense and resolution."}, {"q": "What is one major purpose of creative nonfiction?", "o": ["To express true feelings experienced in real life", "To impress readers with invented tales", "To hide the writer's experience", "To eliminate emotion from writing"], "a": 0, "d": "Easy", "e": "Creative nonfiction expresses true feelings experienced in real life."}, {"q": "How can descriptive words and phrases help a creative nonfiction piece?", "o": ["They can entertain readers and help them share the writer's experiences.", "They make factual details unnecessary.", "They turn true events into fiction.", "They prevent readers from imagining the scene."], "a": 0, "d": "Easy", "e": "Descriptive language can entertain and allow readers to share the writer's experiences."}, {"q": "If a writer wants readers to support an idea in a creative nonfiction account, what should the writer focus on?", "o": ["Presenting a truthful, meaningful account in a convincing way", "Inventing evidence that supports the claim", "Removing all personal observations", "Using difficult words regardless of meaning"], "a": 0, "d": "Moderate", "e": "The material emphasizes truthful, expressive writing."}, {"q": "Which statement best reflects the instruction 'express, not impress'?", "o": ["Focus on honestly communicating a meaningful experience rather than showing off literary style.", "Use the most complicated words possible.", "Add fictional details to impress the audience.", "Avoid explaining what happened."], "a": 0, "d": "Moderate", "e": "The goal is to express rather than impress."}, {"q": "A writer produces a beautifully worded story but exaggerates events that never happened. Why does this fail as creative nonfiction?", "o": ["The work sacrifices truthfulness for literary effect.", "The writer used too many descriptive words.", "The writer used a first-person point of view.", "The writer included a setting."], "a": 0, "d": "Hard", "e": "Creative nonfiction may be artistic, but the events must remain true and verifiable."}, {"q": "What is the theme of a creative nonfiction story?", "o": ["The central subject or key idea of the story", "The place where the story happens", "A conversation between characters", "The sequence of punctuation marks"], "a": 0, "d": "Easy", "e": "Theme is the central subject or key idea."}, {"q": "What does plot refer to?", "o": ["The flow of events or storyline", "The general mood of the story", "The people involved in the story", "The physical description of a character"], "a": 0, "d": "Easy", "e": "Plot is the flow of events or storyline."}, {"q": "Which element refers to the main issues and challenges that need to be resolved?", "o": ["Conflict", "Setting", "Theme", "Dialogue"], "a": 0, "d": "Moderate", "e": "Conflict refers to the main issues and challenges that need resolution."}, {"q": "What is the difference between characters and characterization?", "o": ["Characters are the people or entities involved; characterization is how they are chosen and portrayed.", "Characters are the setting; characterization is the plot.", "Characters are conflicts; characterization is the theme.", "They mean exactly the same thing."], "a": 0, "d": "Moderate", "e": "The material distinguishes the characters from the art of portraying them, called characterization."}, {"q": "Which combination correctly describes setting?", "o": ["When and where the story happens, including narrative time and atmosphere", "Only the main character's personality", "Only the central conflict", "Only the sequence of dialogue"], "a": 0, "d": "Hard", "e": "Setting includes when and where the story happens, including narrative time and atmosphere."}, {"q": "What does tone refer to in literature?", "o": ["The attitude or emotional quality conveyed to readers", "The list of facts in a text", "The location of the story", "The number of characters"], "a": 0, "d": "Easy", "e": "Tone refers to how personality or attitude is conveyed to prompt a reaction or interpretation."}, {"q": "What does voice focus on according to the LAS?", "o": ["What message to communicate", "Where the story happens", "When the conflict occurs", "How many paragraphs a story has"], "a": 0, "d": "Easy", "e": "Voice focuses on what message to communicate."}, {"q": "Which pair correctly distinguishes tone and voice?", "o": ["Tone is how the message is delivered; voice is the content or message being communicated.", "Tone is the setting; voice is the conflict.", "Tone is the plot; voice is the character.", "Tone and voice are unrelated."], "a": 0, "d": "Moderate", "e": "The LAS directly distinguishes tone as delivery and voice as content/message."}, {"q": "A narrator uses respectful, apologetic language to describe a serious event. Which concept is most directly shown by the narrator's choice of language?", "o": ["Tone", "Plot", "Setting", "Conflict"], "a": 0, "d": "Hard", "e": "Word choice can communicate tones such as apologetic, grateful, sarcastic, or reverent."}, {"q": "What is point of view?", "o": ["The choice of pronouns showing how and by whom a story is told", "The central idea of a story", "The place where a story happens", "The conflict in a story"], "a": 0, "d": "Easy", "e": "Point of view refers to the pronouns used and how the story is told."}, {"q": "Which point of view uses 'I' or 'We'?", "o": ["First person", "Second person", "Third person", "Objective point of view"], "a": 0, "d": "Easy", "e": "I/We indicates first-person point of view."}, {"q": "Which figure of speech compares one object or idea with another without using 'like' or 'as'?", "o": ["Metaphor", "Simile", "Irony", "Dialogue"], "a": 0, "d": "Moderate", "e": "A metaphor compares one object or idea with another."}, {"q": "Which sentence uses a simile?", "o": ["The children ran like deer across the field.", "The classroom was a battlefield.", "Thanks to your enthusiasm, nothing was accomplished.", "The school bell shouted at noon."], "a": 0, "d": "Hard", "e": "A simile is a comparison signaled by 'like' or 'as.'"}, {"q": "What is one way to develop a theme into an informative and persuasive article?", "o": ["Combine creative nonfiction elements with the 5 Ws.", "Remove the conflict from the story.", "Use only dialogue.", "Avoid identifying the main character."], "a": 0, "d": "Easy", "e": "The LAS teaches writers to combine elements with What, Who, When, Where, and Why."}, {"q": "In the 5 Ws matrix, 'Who' mainly asks what question?", "o": ["Who is the main character?", "Where did the event happen?", "Why is the event relevant?", "When did the event happen?"], "a": 0, "d": "Easy", "e": "'Who' identifies the main character or people involved."}, {"q": "Which question helps a writer explain the relevance of an event?", "o": ["Why is this event relevant?", "Who is the main character?", "When did it happen?", "Where did it happen?"], "a": 0, "d": "Moderate", "e": "The 'Why' column asks why the event is relevant."}, {"q": "Which stage involves gathering statistical data, observations, interviews, surveys, and authenticated documents?", "o": ["Information and data gathering", "Drafting", "Revising", "Editing and proofreading"], "a": 0, "d": "Easy", "e": "The first stage is information and data gathering."}, {"q": "During which stage does a writer create a rough version based on a tentative outline?", "o": ["Drafting", "Visualization and presentation", "Editing", "Proofreading only"], "a": 0, "d": "Moderate", "e": "Drafting is the stage of writing the rough version."}, {"q": "Which stage may include rearranging information and changing the approach or perspective?", "o": ["Revising", "Data gathering", "Drafting", "Final printing"], "a": 0, "d": "Moderate", "e": "Revising includes rearranging information or changing the approach/perspective."}, {"q": "A writer checks facts, numerical estimates, grammar, syntax, and semantics before submitting an article. What stage is this?", "o": ["Editing and proofreading", "Drafting", "Information gathering", "Visualization"], "a": 0, "d": "Hard", "e": "Checking facts and language mechanics is editing and proofreading."}, {"q": "What should a writer do first when preparing to write an effective nonfiction piece?", "o": ["Know the subject or topic and its details", "Write the conclusion immediately", "Proofread before drafting", "Publish the article"], "a": 0, "d": "Easy", "e": "The first listed step is to know the subject/topic and its details."}, {"q": "What is the purpose of a thesis statement?", "o": ["To introduce the reader to the message of the article", "To list every grammar rule", "To replace the conclusion", "To identify only the setting"], "a": 0, "d": "Easy", "e": "The thesis statement introduces the reader to the message of the article."}, {"q": "Which organization is recommended for a nonfiction account?", "o": ["Introduction, body, and conclusion", "Title, conflict, and dialogue only", "Beginning, climax, and ending only", "Data, citations, and bibliography only"], "a": 0, "d": "Moderate", "e": "The material recommends introduction, body, and conclusion."}, {"q": "Why should a writer reread a draft before revising it?", "o": ["To re-examine the manuscript from the reader's perspective and improve its structure.", "To avoid making any changes.", "To replace all facts with opinions.", "To publish it immediately."], "a": 0, "d": "Hard", "e": "The LAS advises rereading the draft and considering it from the reader's perspective."}, {"q": "According to LAS 10, how long should the article be at most?", "o": ["Two pages and not more than 1,000 words", "Five pages and 2,000 words", "One page and 500 words", "Ten pages and 5,000 words"], "a": 0, "d": "Easy", "e": "The project specifies a two-page article with no more than 1,000 words."}, {"q": "Why must the article include researched details?", "o": ["Because the subject is nonfiction and the details need to be supported by research and citations.", "Because fiction requires citations.", "Because creative writing cannot use personal experience.", "Because articles should contain no evidence."], "a": 0, "d": "Moderate", "e": "The LAS requires researched details and citations because the task is nonfiction."}, {"q": "Which formatting instruction is required for the article?", "o": ["12-point Times New Roman with 1.5 line spacing", "10-point Arial with single spacing", "14-point Calibri with double spacing", "11-point Verdana with 2.5 spacing"], "a": 0, "d": "Moderate", "e": "The project specifies 12-point Times New Roman and 1.5 line spacing."}, {"q": "Which set correctly states the grading criteria and their total?", "o": ["Content 30, organization 30, literary elements 20, grammar 10, neatness/punctuality 10 = 100", "Content 40, organization 20, literary elements 20, grammar 10, neatness 5 = 95", "Content 25, organization 25, literary elements 25, grammar 15, neatness 5 = 95", "Content 30, organization 20, literary elements 30, grammar 10, neatness 5 = 95"], "a": 0, "d": "Hard", "e": "The five criteria are 30, 30, 20, 10, and 10 points, totaling 100."}, {"q": "How many times should a writer ideally read an article during evaluation according to the LAS?", "o": ["At least twice", "Exactly once", "Only after publishing", "Ten times"], "a": 0, "d": "Easy", "e": "The first reading is for the big picture and later readings can be for critical reading."}, {"q": "Which evaluation criterion asks whether the main idea and theme are clearly presented?", "o": ["Clarity of the main idea and theme", "Appropriateness of the topic only", "Length of the title", "Number of paragraphs"], "a": 0, "d": "Moderate", "e": "Clarity of the main idea and theme is a listed evaluation criterion."}, {"q": "What should an evaluator consider when checking consistency and coherence?", "o": ["Whether the article makes sense and whether the writer appears biased toward a point of view", "Only the spelling of the title", "Only the number of citations", "Only the font style"], "a": 0, "d": "Moderate", "e": "Evaluators consider sense, consistency, coherence, and possible bias."}, {"q": "An article has excellent facts but the literary elements do not fit the topic and make the main idea unclear. Which evaluation criteria are most relevant?", "o": ["Appropriateness/effectiveness of literary elements and their combination with the idea", "Only grammar and spelling", "Only the article's title", "Only the length requirement"], "a": 0, "d": "Hard", "e": "The rubric evaluates the appropriateness/effectiveness of literary elements and how they combine with the idea."}, {"q": "What is the main purpose of revising an article?", "o": ["To improve and enhance the article", "To publish it without changes", "To add unrelated information", "To remove all literary elements"], "a": 0, "d": "Easy", "e": "Revision is done to improve the article and enhance its impact."}, {"q": "Which revision strategy can improve clarity?", "o": ["Add or substitute words or phrases for better nuance or sharper meaning", "Delete every descriptive word", "Change all facts", "Avoid rereading the article"], "a": 0, "d": "Moderate", "e": "Adding or substituting words can improve clarity and meaning."}, {"q": "Why should a writer cross-check the revised article with the outline?", "o": ["To determine whether the sequence of ideas is appropriate and remove unnecessary or redundant statements", "To make the article longer", "To replace the thesis with a title", "To avoid checking grammar"], "a": 0, "d": "Moderate", "e": "The LAS recommends checking the sequence against the outline and removing unnecessary material."}, {"q": "A writer receives criticism that several paragraphs repeat the same idea. What revision strategy from the LAS should be applied?", "o": ["Remove unnecessary or redundant statements and reorganize the ideas if needed.", "Add more repeated sentences.", "Ignore the evaluation.", "Change the article into fiction."], "a": 0, "d": "Hard", "e": "Revision includes removing redundant statements and reorganizing ideas."}, {"q": "What two components are combined in a creative nonfiction piece according to LAS 14?", "o": ["A factual topic and literary elements", "Fictional characters and fantasy", "Statistics and poetry only", "Dialogue and imaginary events"], "a": 0, "d": "Easy", "e": "Creative nonfiction combines a factual topic with literary elements."}, {"q": "Why should a writer examine personal experiences or observations relevant to the topic?", "o": ["They create a personal atmosphere that helps readers relate to the writer.", "They replace all research.", "They make the topic fictional.", "They prevent the writer from expressing opinions."], "a": 0, "d": "Moderate", "e": "Relevant experiences and observations create a personal atmosphere that allows readers to relate."}, {"q": "Which is NOT listed as a possible goal for expressing thoughts in the creative nonfiction piece?", "o": ["Confusing the audience", "Persuading", "Educating", "Entertaining"], "a": 0, "d": "Moderate", "e": "The LAS lists persuading, educating, entertaining, criticizing a belief, or commenting on an important issue—not confusing the audience."}, {"q": "Why does the LAS advise writers to focus on essential points?", "o": ["Including everything can overwhelm the writer with information, so important points should be filtered and prioritized.", "Because creative nonfiction should contain no information.", "Because readers dislike any details.", "Because research is unnecessary."], "a": 0, "d": "Hard", "e": "Too much information can overwhelm the writer, so important points should be filtered and prioritized."}, {"q": "What should a learner do after identifying issues or problems shown in the news report?", "o": ["Choose one or two issues that will become the thesis of the creative nonfiction piece.", "Ignore the issues and write about an unrelated topic.", "Copy the entire news report.", "Write only a title."], "a": 0, "d": "Easy", "e": "The instructions say to choose one or two issues from the report to serve as the thesis."}, {"q": "How many paragraphs or more should the final creative nonfiction essay contain?", "o": ["Five paragraphs or more", "Two paragraphs only", "Three sentences only", "One paragraph only"], "a": 0, "d": "Easy", "e": "The final output requires a five-paragraph or longer essay."}, {"q": "Which instruction is part of the required physical format for the final output?", "o": ["Use short bond paper with a 1-inch border on each side.", "Use legal-size paper without margins.", "Use long bond paper with no border.", "Use any paper size without formatting."], "a": 0, "d": "Moderate", "e": "The LAS specifies short bond paper with a 1-inch border on each side."}, {"q": "Which criterion receives the highest number of points in the final-output grading?", "o": ["Substance of Content", "Grammar", "Neatness and Punctuality", "Effective Utilization of Literary Elements"], "a": 0, "d": "Moderate", "e": "Substance of Content and organization each receive 30 points, the highest individual allocations."}, {"q": "A learner writes a well-organized essay with excellent literary elements but weak factual support about the chosen news issue. Which instruction from the LAS should the learner revisit first?", "o": ["Research the topic and know its issues and details thoroughly.", "Add more fictional scenes.", "Remove the thesis.", "Avoid personal observations."], "a": 0, "d": "Hard", "e": "The LAS emphasizes knowing the topic, researching it, and understanding its issues and details."}, {"q": "Which sequence best follows the final-output instructions in LAS 14?", "o": ["Watch the news report → list issues/problems → choose one or two as thesis → write five or more paragraphs → submit using the required format", "Choose a thesis → publish immediately → watch the news report → list issues", "Write the essay → invent issues → remove the thesis → submit", "List references → ignore the report → write one paragraph → submit"], "a": 0, "d": "Hard", "e": "This sequence follows the final-output instructions in the LAS."}];let order=[],i=0,score=0,streak=0,answered=false;
const $=x=>document.getElementById(x);
function shuffle(a){for(let n=a.length-1;n>0;n--){let j=Math.floor(Math.random()*(n+1));[a[n],a[j]]=[a[j],a[n]]}return a}
function startGame(){order=shuffle([...Array(DATA.length).keys()]);i=0;score=0;streak=0;$('intro').classList.add('hidden');$('finish').classList.add('hidden');$('game').classList.remove('hidden');render()}
function render(){answered=false;let x=DATA[order[i]];
$('count').textContent=`Question ${i+1} of ${DATA.length}`;$('score').textContent=score;$('streak').textContent=streak;
$('fill').style.width=(i/DATA.length*100)+'%';$('diff').textContent=x.d;$('question').textContent=x.q;$('feedback').innerHTML='';
$('next').disabled=true;$('next').textContent=i===DATA.length-1?'See Results 🏆':'Next Question →';let box=$('options');box.innerHTML='';
x.o.forEach((t,k)=>{let b=document.createElement('button');b.className='option';b.innerHTML=`<b>${String.fromCharCode(65+k)}.</b> ${t}`;b.onclick=()=>answer(k,b);box.appendChild(b)})}
function answer(choice,clicked){if(answered)return;answered=true;let x=DATA[order[i]],bs=[...$('options').children];bs.forEach(b=>b.disabled=true);
if(choice===x.a){clicked.classList.add('correct');streak++;let pts=x.d==='Hard'?3:x.d==='Moderate'?2:1;score+=pts;$('feedback').innerHTML=`<b>✅ Correct! +${pts} point${pts>1?'s':''}</b><br>${x.e}`;}
else{clicked.classList.add('wrong');bs[x.a].classList.add('correct');streak=0;$('feedback').innerHTML=`<b>❌ Not quite.</b><br>Correct answer: <b>${String.fromCharCode(65+x.a)}. ${x.o[x.a]}</b><br>${x.e}`;}
$('score').textContent=score;$('streak').textContent=streak;$('next').disabled=false}
$('start').onclick=startGame;$('again').onclick=startGame;
$('next').onclick=()=>{if(!answered)return;if(i<DATA.length-1){i++;render()}else{
$('game').classList.add('hidden');$('finish').classList.remove('hidden');$('fill').style.width='100%';
$('final').textContent=`You earned ${score} points!`;let p=score/(DATA.length*3);
$('msg').textContent=p>=.9?'Outstanding! You are exam-ready! 🏆':p>=.75?'Great job! Review the questions you missed. 💪':p>=.6?'Good start! Keep reviewing. 📚':'Keep practicing—you can do this! 🔥';}};
</script></body></html>
